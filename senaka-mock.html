<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>社長の背中SNS スマホ版モック</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>
/* ============================================================
   社長の背中SNS　スマートフォン版モック（黒と朱）
   ============================================================ */
:root{
  color-scheme: dark;
  --bg:#1A1A1A; --card:#2A2A2A; --card2:#242424;
  --line:#383838; --line2:#2E2E2E;
  --key:#B03633; --keyInk:#FFFFFF; --accent:#B03633;
  --ink:#FFFFFF; --mid:#A8A8A8; --weak:#757575;
  --hdH:54px; --tabH:64px;
  --min:'Noto Serif CJK JP','Hiragino Mincho ProN','Yu Mincho',serif;
  --got:'Noto Sans CJK JP','Hiragino Sans','Yu Gothic UI',Meiryo,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:#0E0F10; color:var(--ink);
  font-family:var(--got); font-size:15px;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
input,textarea,select{font:inherit;color:inherit}
.ph{border-radius:50%;overflow:hidden;flex-shrink:0;display:block}
.ph svg{display:block;width:100%;height:100%}

/* ---------- 台と端末の枠 ---------- */
.stage{min-height:100%;display:flex;flex-direction:column;align-items:center}
.stageHd{display:none;text-align:center;padding:26px 16px 14px;color:#8A9099}
.stageHd h1{font-family:var(--min);font-size:19px;font-weight:600;letter-spacing:.05em;
            margin-bottom:5px;color:#D4D8DD}
.stageHd p{font-size:12.5px;line-height:1.8}

.phone{
  width:100%;max-width:400px;background:var(--bg);
  display:flex;flex-direction:column;overflow:hidden;position:relative;
  min-height:100vh;min-height:100dvh;
}
@media (min-width:820px){
  .stageHd{display:block}
  .phone{
    height:844px;min-height:0;border-radius:40px;
    border:10px solid #0A0A0A;box-shadow:0 22px 60px rgba(0,0,0,.6);
    margin-bottom:40px;
  }
}

.screen{display:none;flex-direction:column;flex:1;min-height:0;overflow-y:auto;background:var(--bg)}
.screen.on{display:flex}
.body{flex:1 0 auto;padding:15px 15px 10px}
.body.flat{padding:0}

/* ---------- 上の帯 ---------- */
.hd{
  position:sticky;top:0;z-index:20;height:var(--hdH);flex-shrink:0;
  display:flex;align-items:center;gap:10px;padding:0 15px;
  background:var(--bg);border-bottom:1px solid var(--line2);
}
.hdT{font-family:var(--min);font-size:17.5px;font-weight:600;letter-spacing:.04em;
     flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdS{font-family:var(--got);font-size:10.5px;color:var(--weak);margin-left:8px;font-weight:400}
.bk{font-size:23px;line-height:1;margin-left:-6px;padding:4px 6px;color:var(--ink)}
.hdA{font-size:12px;color:var(--key);font-weight:700;flex-shrink:0;padding:4px}

/* ---------- 下のタブ ---------- */
.tabs{
  position:sticky;bottom:0;z-index:20;height:var(--tabH);flex-shrink:0;
  display:grid;grid-template-columns:repeat(4,1fr);
  background:var(--bg);border-top:1px solid var(--line2);
}
.tb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    font-size:10px;color:var(--weak);position:relative}
.tb.on{color:var(--key);font-weight:700}
.ti{line-height:0}.ti svg{width:20px;height:20px;display:block}
.tbn{position:absolute;top:9px;left:50%;margin-left:7px;min-width:17px;height:17px;padding:0 5px;
     border-radius:9px;background:var(--key);color:var(--keyInk);font-size:10px;font-weight:700;
     line-height:17px;text-align:center}

/* ---------- やりとり一覧 ---------- */
.cv{display:flex;gap:13px;align-items:center;background:var(--card);border-radius:12px;
    padding:13px 14px;margin-bottom:9px;width:100%}
.cv:active{background:#333}
.cvM{flex:1;min-width:0;display:flex;flex-direction:column}
.cvT{display:flex;align-items:baseline;gap:7px}
.cvN{font-family:var(--min);font-size:15.5px;font-weight:600;white-space:nowrap;
     overflow:hidden;text-overflow:ellipsis}
.cvS{font-size:11px;color:var(--weak);white-space:nowrap;flex-shrink:0}
.cvW{font-size:11px;color:var(--weak);margin-left:auto;flex-shrink:0}
.cvC{font-size:11px;color:var(--weak);margin-top:1px}
.cvP{font-size:12.5px;color:var(--mid);margin-top:4px;white-space:nowrap;
     overflow:hidden;text-overflow:ellipsis}
.mk{width:50px;height:50px;border-radius:50%;background:var(--card2);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-family:var(--min);
    font-size:18px;flex-shrink:0}
.mk.acc{background:var(--key);color:var(--keyInk);border-color:var(--key)}
.mk.sm{width:34px;height:34px;font-size:13px}
.bdg{min-width:21px;height:21px;padding:0 6px;border-radius:11px;background:var(--key);
     color:var(--keyInk);font-size:11px;font-weight:700;line-height:21px;text-align:center;flex-shrink:0}

/* ---------- 会話 ---------- */
.thread{flex:1 0 auto;padding:14px 14px 10px;display:flex;flex-direction:column}
.day{text-align:center;font-size:11px;color:var(--weak);margin:12px 0}
.mr{display:flex;gap:8px;align-items:flex-end;margin-bottom:11px}
.mr.cont{margin-bottom:5px}
.mr.me{flex-direction:row-reverse}
.sp30{width:30px;flex-shrink:0}
.mw{max-width:78%;display:flex;flex-direction:column;gap:3px}
.mr.me .mw{align-items:flex-end}
.who{font-size:11px;color:var(--mid);padding:0 4px}
.bub{background:var(--card);border-radius:14px;padding:11px 14px;font-size:14.5px;
     line-height:1.75;white-space:pre-wrap;word-break:break-word}
.mr.me .bub{background:var(--key);color:var(--keyInk)}
.mtime{font-size:10px;color:var(--weak);padding:0 4px}
.mtime .rep{color:var(--weak);text-decoration:underline;margin-left:6px}
.cmp{position:sticky;bottom:0;z-index:15;flex-shrink:0;display:flex;gap:9px;align-items:flex-end;
     padding:10px 13px;background:var(--bg);border-top:1px solid var(--line2)}
.cmp textarea{flex:1;background:var(--card);border:0;border-radius:20px;padding:11px 16px;
              font-size:15px;resize:none;outline:none;max-height:110px;line-height:1.6}
.cmp textarea::placeholder{color:var(--weak)}
.send{width:42px;height:42px;border-radius:50%;background:var(--key);color:var(--keyInk);
      display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.send:disabled{background:var(--card);color:var(--weak)}

/* ---------- 会員をさがす ---------- */
.srch{margin-bottom:12px}
.srch input{width:100%;background:var(--card);border:0;border-radius:21px;
            padding:11px 17px;font-size:14px;outline:none}
.srch input::placeholder{color:var(--weak)}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line);border-radius:15px;padding:5px 13px;font-size:12px;color:var(--mid)}
.chip.on{background:var(--key);border-color:var(--key);color:var(--keyInk);font-weight:700}
.cnt{font-size:12px;color:var(--weak);margin-bottom:11px}
.row{display:flex;gap:12px;background:var(--card);border-radius:12px;padding:13px 14px;
     margin-bottom:9px;align-items:center;width:100%}
.row:active{background:#333}
.rm{flex:1;min-width:0;display:flex;flex-direction:column}
.rn{font-family:var(--min);font-size:15.5px;font-weight:600}
.rc{font-size:12px;color:var(--mid);margin-top:2px}
.ra{font-size:12px;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rb{font-size:11px;color:var(--weak);margin-top:6px}
.tagA{background:var(--key);color:var(--keyInk);font-size:9px;font-weight:700;
      border-radius:3px;padding:1px 5px;margin-left:6px;vertical-align:middle}
.tagA.big{font-size:10.5px;padding:2px 7px;margin-left:8px}

/* ---------- プロフィール ---------- */
.hero{background:var(--card2);padding:28px 20px 24px;text-align:center}
.hero .ph{margin:0 auto}
.hName{font-family:var(--min);font-size:22px;font-weight:600;margin-top:14px;letter-spacing:.03em}
.hCo{font-size:13.5px;color:var(--mid);margin-top:5px}
.tags{display:flex;gap:6px;justify-content:center;margin-top:11px;flex-wrap:wrap}
.tg{border:1px solid var(--line);border-radius:11px;padding:3px 11px;font-size:11.5px;color:var(--mid)}
.hBy{font-size:12px;color:var(--weak);text-align:center;padding:15px 20px 0;line-height:1.7}
.art{margin:14px 15px;background:var(--card);border-left:3px solid var(--accent);
     border-radius:10px;padding:17px 18px}
.aK{font-size:10.5px;color:var(--accent);letter-spacing:.12em;font-weight:700;margin-bottom:7px}
.aT{font-family:var(--min);font-size:16.5px;line-height:1.7;font-weight:600}
.aL{font-size:12.5px;color:var(--mid);line-height:1.95;margin-top:11px}
.aG{font-size:12.5px;color:var(--key);font-weight:700;margin-top:14px}
.btn{display:block;width:100%;background:var(--key);color:var(--keyInk);border-radius:11px;
     padding:15px;text-align:center;font-size:15px;font-weight:700}
.btn.ghost{background:none;border:1px solid var(--key);color:var(--key)}
.btn.quiet{background:none;border:1px solid var(--line);color:var(--mid)}
.btn.danger{background:none;border:1px solid var(--key);color:var(--key)}
.btn:disabled{opacity:.45}
.two{display:flex;gap:10px}
.two>*{flex:1}
.pad{padding:0 15px}
.note2{font-size:11.5px;color:var(--weak);padding:14px 20px;line-height:1.8;text-align:center}

/* ---------- 共通の部品 ---------- */
.note{background:var(--card2);border-left:3px solid var(--accent);border-radius:8px;
      padding:14px 16px;font-size:12.5px;line-height:1.95;color:var(--mid)}
.note b{color:var(--ink)}
.panel{background:var(--card);border-radius:12px;padding:18px}
.secL{font-size:11px;color:var(--weak);letter-spacing:.09em;font-weight:700;margin:22px 0 9px}
.secL:first-child{margin-top:4px}
.fl{display:block;font-size:12px;font-weight:700;color:var(--mid);margin:14px 0 6px}
.fl:first-child{margin-top:0}
.fx{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:9px;
    padding:12px 14px;font-size:15px;outline:none;line-height:1.7}
.fx:focus{border-color:var(--key)}
.fx:disabled{color:var(--weak)}
textarea.fx{resize:vertical}
.hint{font-size:11.5px;color:var(--weak);margin-top:6px;line-height:1.75}
.ok{background:#20331F;border:1px solid #38562F;border-radius:9px;padding:13px 15px;
    font-size:13px;color:#9FCB8E;margin-bottom:14px}
.codeBox{background:var(--card2);border:1px dashed var(--line);border-radius:9px;padding:14px;
         text-align:center;font-family:ui-monospace,Menlo,monospace;font-size:17px;
         letter-spacing:.13em;font-weight:600}
.muted{font-size:12.5px;color:var(--mid);line-height:1.95}
.sp{height:13px}
.ivRow{display:flex;flex-direction:column;gap:4px;background:var(--card);border-radius:11px;
       padding:13px 14px;margin-bottom:9px}
.ivTop{display:flex;align-items:center;gap:10px}
.ivC{font-family:ui-monospace,Menlo,monospace;font-size:13px;letter-spacing:.06em;flex:1}
.ivD{font-size:11px;color:var(--weak);line-height:1.7}
.st{display:inline-block;border:1px solid var(--line);border-radius:9px;padding:2px 9px;
    font-size:10.5px;color:var(--weak);flex-shrink:0}
.st.ok2{color:#9FCB8E;border-color:#38562F}
.st.wait{color:#D9A84E;border-color:#5A4722}

/* ---------- 運営 ---------- */
.atabs{display:flex;gap:7px;padding:11px 15px;overflow-x:auto;background:var(--bg);
       border-bottom:1px solid var(--line2);position:sticky;top:var(--hdH);z-index:15}
.at{flex-shrink:0;border:1px solid var(--line);border-radius:15px;padding:6px 14px;
    font-size:12px;color:var(--mid);display:flex;align-items:center;gap:6px;white-space:nowrap}
.at.on{background:var(--key);border-color:var(--key);color:var(--keyInk);font-weight:700}
.atn{background:rgba(0,0,0,.28);border-radius:8px;padding:0 5px;font-size:9.5px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:15px}
.st1{background:var(--card);border-radius:11px;padding:14px 16px}
.stn{font-size:23px;font-weight:700;font-family:var(--min)}
.stn.acc{color:var(--key)}
.stl{font-size:11px;color:var(--weak);margin-top:2px}
.pcard{background:var(--card);border-radius:12px;padding:17px 18px;margin-bottom:13px}
.pHd{display:flex;align-items:center;gap:12px;margin-bottom:13px}
.pN{font-size:15.5px;font-weight:700}
.pC{font-size:11.5px;color:var(--mid);margin-top:2px}
.ptbl{display:grid;grid-template-columns:76px 1fr;row-gap:6px;font-size:12px;margin-bottom:15px}
.pk{color:var(--weak)}
.pv{word-break:break-all}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dim{color:var(--weak);font-size:11.5px}
.snapT{font-size:11px;color:var(--weak);letter-spacing:.08em;font-weight:700;margin:14px 0 8px}
.snap{background:var(--card2);border-radius:9px;padding:13px 15px;font-size:12.5px;line-height:1.8}
.snr{padding:7px 0;border-bottom:1px dashed var(--line)}
.snr:last-child{border-bottom:0}
.snr.tgt{background:rgba(176,54,51,.15);margin:0 -15px;padding:7px 15px}
.snw{font-weight:700;color:var(--key);font-size:11.5px}
.snt{color:var(--weak);font-size:10.5px;margin-left:7px}
.mark{color:var(--key);font-weight:700;font-size:10.5px;display:block;margin-top:2px}
.aRow{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:11px;
      padding:12px 14px;margin-bottom:8px}
.aN{font-size:14px;font-weight:700}
.aC{font-size:11.5px;color:var(--mid);margin-top:2px}

/* ---------- 空の表示 ---------- */
.empty{text-align:center;padding:50px 26px;color:var(--weak)}
.emIc{opacity:.5;margin-bottom:11px}
.emIc svg{width:30px;height:30px;display:inline-block}
.emT{font-size:14.5px;color:var(--mid);font-weight:700;margin-bottom:7px}
.emS{font-size:12.5px;line-height:1.85}

/* ---------- 入り口の画面 ---------- */
.sign{text-align:center;padding:40px 26px 24px}
.signT{font-family:var(--min);font-size:24px;font-weight:600;letter-spacing:.06em;margin-bottom:9px}
.signS{font-size:12.5px;color:var(--mid);line-height:1.9}
.link{color:var(--key);text-decoration:underline;text-underline-offset:2px}

/* ---------- 画面一覧 ---------- */
.idxBtn{position:fixed;right:14px;bottom:calc(var(--tabH) + 14px);z-index:60;
        background:#0A0A0A;border:1px solid var(--line);color:var(--ink);border-radius:22px;
        padding:10px 17px;font-size:12.5px;font-weight:700;box-shadow:0 4px 18px rgba(0,0,0,.5)}
@media (min-width:820px){.idxBtn{bottom:22px}}
.idx{position:fixed;inset:0;z-index:70;background:rgba(6,7,8,.95);display:none;
     overflow-y:auto;padding:24px 16px 92px}
.idx.on{display:block}
.idx h2{font-family:var(--min);font-size:17px;text-align:center;font-weight:600;letter-spacing:.05em}
.idxNote{color:var(--weak);font-size:11.5px;text-align:center;margin:6px 0 18px;line-height:1.7}
.idxG{font-size:10.5px;color:var(--weak);font-weight:700;letter-spacing:.1em;
      margin:18px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.idxGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;
         max-width:760px;margin:0 auto}
.idxGrid button{background:var(--card);border:1px solid var(--line);border-radius:9px;
                padding:11px 13px;font-size:12.5px;line-height:1.5}
.idxGrid button b{display:block;font-weight:600}
.idxGrid button span{color:var(--weak);font-size:10.5px;font-family:ui-monospace,Menlo,monospace}
.idxClose{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;z-index:75;
          background:#fff;color:#0A0A0A;border-radius:22px;padding:11px 28px;
          font-size:13px;font-weight:700}

.mockTag{position:absolute;left:12px;bottom:calc(var(--tabH) + 10px);z-index:10;
         pointer-events:none;background:var(--card2);border:1px solid var(--line);
         border-radius:12px;padding:3px 9px;font-size:9.5px;color:var(--weak);opacity:.8}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabH) + 22px);
       z-index:80;background:#0A0A0A;border:1px solid var(--line);border-radius:9px;
       padding:12px 18px;font-size:12.5px;max-width:84%;text-align:center;line-height:1.6;
       opacity:0;pointer-events:none;transition:opacity .18s}
.toast.on{opacity:1}

::-webkit-scrollbar{width:0;height:0}
:focus-visible{outline:2px solid var(--key);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

</style>
</head>
<body>

<div class="stage">
  <div class="stageHd">
    <h1>社長の背中SNS（仮）　スマートフォン版</h1>
    <p>実際に作る画面と同じ見た目・同じ操作です。データは架空のものです。<br>
       右下の「画面一覧」から、どの画面にも飛べます。</p>
  </div>

  <div class="phone">
    <div class="mockTag">モック</div>
    <div class="screen on" id="screen"></div>
  </div>
</div>

<button class="idxBtn" id="idxOpen">画面一覧</button>

<div class="idx" id="idx">
  <h2>画面一覧</h2>
  <p class="idxNote">どの画面にも飛べます。</p>
  <div class="idxG">入り口</div><div class="idxGrid"><button data-jump="login"><b>ログイン</b><span>/login</span></button><button data-jump="join"><b>ご招待・お申し込み</b><span>/join/[コード]</span></button><button data-jump="pending"><b>確認中</b><span>/pending</span></button></div>
  <div class="idxG">会員の画面</div><div class="idxGrid"><button data-jump="home"><b>やりとり一覧</b><span>/</span></button><button data-jump="thread:yamada"><b>1対1のやりとり</b><span>/t/[id]</span></button><button data-jump="thread:everyone"><b>会員全員のつどい</b><span>/t/[id]</span></button><button data-jump="thread:tokai"><b>グループのやりとり</b><span>/t/[id]</span></button><button data-jump="members"><b>会員をさがす</b><span>/members</span></button><button data-jump="member:yamada"><b>プロフィール（友達）</b><span>/members/[id]</span></button><button data-jump="member:sasaki"><b>プロフィール（未申込）</b><span>/members/[id]</span></button><button data-jump="invite"><b>招待する</b><span>/invite</span></button><button data-jump="me"><b>自分の設定</b><span>/me</span></button></div>
  <div class="idxG">運営（事務局）の画面</div><div class="idxGrid"><button data-jump="admin:pending"><b>承認待ち</b><span>/admin</span></button><button data-jump="admin:members"><b>会員管理</b><span>/admin/members</span></button><button data-jump="admin:groups"><b>グループ</b><span>/admin/groups</span></button><button data-jump="admin:announce"><b>一斉連絡</b><span>/admin/announce</span></button><button data-jump="admin:reports"><b>通報</b><span>/admin/reports</span></button></div>
  <button class="idxClose" id="idxClose">閉じる</button>
</div>

        <span class="rm"><span class="aN">${n}</span><span class="aC">${c}名</span></span>
        ${all ? '<span class="st">全員が自動参加</span>' : '<span class="st">変更する</span>'}
      </button>`).join('')}`;
  }

  if (admTab === 'announce') {
    body = `<div class="note">ご利用中の会員 <b>8名</b> のメールアドレスへ、一斉にお送りします。送信したあとの取り消しはできません。</div>
      <div class="sp"></div>
      <div class="panel">
        <label class="fl">件名</label><input class="fx" id="anS" placeholder="例）新しい会員の方のご紹介">
        <label class="fl">本文</label><textarea class="fx" id="anB" rows="6" placeholder="いつもありがとうございます。&#10;事務局よりご連絡いたします。"></textarea>
        <div class="hint">冒頭に「○○ 様」、末尾に「社長の背中SNS 事務局」が自動で入ります。</div>
        <label class="fl">確認のため「送信」とご入力ください</label><input class="fx" id="anC" placeholder="送信">
        <div class="sp"></div>
        <button class="btn" id="anGo" disabled>会員全員へお送りする</button>
      </div>`;
  }

  if (admTab === 'reports') {
    body = `<div class="note">
        会員から「事務局に知らせる」が押されたときに、そのメッセージと前後のやりとりの<b>写し</b>がここに届きます。<br><br>
        事務局は、会員同士の1対1のやりとりそのものを読むことはできません。通報があった分の写しだけを確認する仕組みです。
      </div>
      <div class="sp"></div>
      <div class="pcard">
        <div class="spread">
          <span class="st ${repOpen ? 'wait' : 'ok2'}" id="repTag">${repOpen ? '未対応' : '対応済み'}</span>
          <span class="dim">2026/10/21 19:42</span>
        </div>
        <div class="ptbl" style="margin-top:13px">
          <div class="pk">知らせた方</div><div class="pv">大西 由美</div>
          <div class="pk">対象の方</div><div class="pv">藤本 剛</div>
          <div class="pk">気になった点</div><div class="pv">断ったあとも投資のお誘いが続いています。</div>
        </div>
        <div class="snapT">やりとりの写し（通報された時点のもの）</div>
        <div class="snap">
          <div class="snr"><span class="snw">藤本 剛</span><span class="snt">19:21</span>
            <div>先日のお話、ご検討いただけましたでしょうか。</div></div>
          <div class="snr"><span class="snw">大西 由美</span><span class="snt">19:33</span>
            <div>申し訳ありませんが、今回は見送らせていただきます。</div></div>
          <div class="snr tgt"><span class="snw">藤本 剛</span><span class="snt">19:40</span>
            <span class="mark">← 通報されたメッセージ</span>
            <div>そうおっしゃらずに。今月中なら特別な条件をご用意できます。他の社長さんも皆さん入られていますよ。</div></div>
        </div>
        ${repOpen ? `<div class="sp"></div>
          <button class="btn ghost" data-noop="1">メッセージを非表示にする</button>
          <div class="sp"></div>
          <button class="btn danger" data-noop="1">対象の方を退会させる</button>
          <div class="sp"></div>
          <button class="btn quiet" id="closeRep">対応済みにする</button>`
        : `<div class="hint" style="margin-top:13px">対応：いま ／ 事務局</div>`}
      </div>`;
  }

  return hd('運営', { back: 'home' })
    + `<div class="atabs">${t.map(([k, l, n]) => `
      <button class="at${admTab === k ? ' on' : ''}" data-atab="${k}">${l}${n ? `<span class="atn">${n}</span>` : ''}</button>`).join('')}</div>
    <div class="body">${body}</div>`;
}

/* ---------------- 描画 ---------------- */
const SCREENS = {
  login: screenLogin, join: screenJoin, pending: screenPending,
  home: screenHome, thread: screenThread, members: screenMembers,
  member: screenMember, invite: screenInvite, me: screenMe, admin: screenAdmin,
};

function render() {
  const st = $('#screen');
  st.innerHTML = SCREENS[view]();
  st.scrollTop = 0;
  if (view === 'thread') {
    const th = $('#thread');
    if (th) st.scrollTop = st.scrollHeight;
  }
}

/* ---------------- 操作 ---------------- */
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-view],[data-conv],[data-member],[data-ind],[data-atab],[data-ap],[data-rj],[data-friend],[data-accept],[data-cancel],[data-open],[data-art],[data-noop],[data-report],[data-jump],#sendBtn,#issueInv,#againInv,#copyInv,#saveMe,#logout,#withdraw,#anGo,#closeRep,#idxOpen,#idxClose');
  if (!t) return;

  if (t.id === 'idxOpen') { $('#idx').classList.add('on'); return; }
  if (t.id === 'idxClose') { $('#idx').classList.remove('on'); return; }
  if (t.dataset.jump) {
    const [v, arg] = t.dataset.jump.split(':');
    if (v === 'thread') { curConv = arg; CONV[arg].unread = 0; }
    if (v === 'member') curMember = arg;
    if (v === 'admin') admTab = arg;
    view = v === 'admin' ? 'admin' : v;
    $('#idx').classList.remove('on');
    render(); return;
  }

  if (t.dataset.view) { view = t.dataset.view; render(); return; }
  if (t.dataset.conv) { curConv = t.dataset.conv; CONV[curConv].unread = 0; view = 'thread'; render(); return; }
  if (t.dataset.member) { curMember = t.dataset.member; view = 'member'; render(); return; }
  if (t.dataset.ind) { memInd = t.dataset.ind; render(); return; }
  if (t.dataset.atab) { admTab = t.dataset.atab; render(); return; }

  if (t.dataset.friend) { PEOPLE[t.dataset.friend].rel = 'sent'; render(); toast('お申し込みをお送りしました。'); return; }
  if (t.dataset.accept) { PEOPLE[t.dataset.accept].rel = 'friend'; render(); toast('友達になりました。'); return; }
  if (t.dataset.cancel) { PEOPLE[t.dataset.cancel].rel = 'none'; render(); return; }
  if (t.dataset.open) {
    const id = t.dataset.open;
    if (!CONV[id]) { CONV[id] = { id, kind: 'dm', other: id, unread: 0, when: 'いま', msgs: [] }; CONV_ORDER.unshift(id); }
    curConv = id; view = 'thread'; render(); return;
  }
  if (t.dataset.report) { toast('事務局にお知らせしました。前後のやりとりを含めて確認いたします。'); return; }
  if (t.dataset.art) { toast('本番では、社長の背中の記事ページが開きます。'); return; }
  if (t.dataset.noop) { toast('モックのため、この操作は動きません。'); return; }

  if (t.id === 'sendBtn') { send(); return; }
  if (t.id === 'issueInv') { inviteCode = makeCode(); render(); return; }
  if (t.id === 'againInv') { inviteCode = null; render(); return; }
  if (t.id === 'copyInv') { toast('文面をコピーしました。'); return; }
  if (t.id === 'saveMe') { toast('保存しました。'); return; }
  if (t.id === 'logout') { view = 'login'; render(); return; }
  if (t.id === 'withdraw') { toast('本番では確認の入力を求めます。'); return; }
  if (t.id === 'anGo') { toast('8名へお送りしました。'); return; }
  if (t.id === 'closeRep') { repOpen = false; render(); toast('対応済みにしました。'); return; }

  if (t.dataset.ap) {
    const id = +t.dataset.ap;
    const p = pend.find((x) => x.id === id);
    pend = pend.filter((x) => x.id !== id);
    render(); toast(`${p.name} さんを承認しました。`); return;
  }
  if (t.dataset.rj) { pend = pend.filter((x) => x.id !== +t.dataset.rj); render(); toast('お断りの処理をしました。'); return; }
});

document.addEventListener('input', (e) => {
  if (e.target.id === 'memQ') {
    memQ = e.target.value;
    const s = e.target.selectionStart;
    render();
    const n = $('#memQ');
    if (n) { n.focus(); n.setSelectionRange(s, s); }
  }
  if (e.target.id === 'msgIn') {
    e.target.style.height = 'auto';
    e.target.style.height = Math.min(e.target.scrollHeight, 110) + 'px';
    $('#sendBtn').disabled = !e.target.value.trim();
  }
  if (['anS', 'anB', 'anC'].includes(e.target.id)) {
    const ok = $('#anS').value.trim() && $('#anB').value.trim() && $('#anC').value === '送信';
    $('#anGo').disabled = !ok;
  }
});

document.addEventListener('keydown', (e) => {
  if (e.target.id === 'msgIn' && e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); send(); }
});

function send() {
  const i = $('#msgIn');
  const v = i.value.trim();
  if (!v) return;
  const d = new Date();
  const t = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  CONV[curConv].msgs.push({ who: 'me', t, b: v });
  render();
  const st = $('#screen');
  st.scrollTop = st.scrollHeight;
}

function makeCode() {
  const ch = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = '';
  for (let i = 0; i < 12; i++) s += ch[Math.floor(Math.random() * ch.length)];
  return `${s.slice(0, 4)}-${s.slice(4, 8)}-${s.slice(8, 12)}`;
}

render();

</script>
