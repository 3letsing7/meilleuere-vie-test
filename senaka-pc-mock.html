<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>社長の背中SNS PC版モック</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* ============================================================
   社長の背中SNS　パソコン版モック（黒と朱）
   ============================================================ */
:root{
  color-scheme: dark;
  --bg:#1A1A1A; --panel:#141414; --card:#2A2A2A; --card2:#242424;
  --line:#383838; --line2:#2E2E2E;
  --key:#B03633; --keyInk:#FFFFFF; --accent:#B03633;
  --ink:#FFFFFF; --mid:#A8A8A8; --weak:#757575;
  --min:'Noto Serif CJK JP','Hiragino Mincho ProN','Yu Mincho',serif;
  --got:'Noto Sans CJK JP','Hiragino Sans','Yu Gothic UI',Meiryo,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--got); font-size:14px;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
input,textarea,select{font:inherit;color:inherit}
.ph{border-radius:50%;overflow:hidden;flex-shrink:0;display:block}
.ph svg{display:block;width:100%;height:100%}

/* 狭い画面のお知らせ */
.narrowMsg{display:none}
@media (max-width:1000px){
  .app{display:none}
  .narrowMsg{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    height:100%;text-align:center;gap:14px;
    padding-left:max(16px,env(safe-area-inset-left,0px));
    padding-right:max(16px,env(safe-area-inset-right,0px));
    padding-block:40px;
  }
  .narrowMsg h1{font-family:var(--min);font-size:20px;font-weight:600;letter-spacing:.04em}
  .narrowMsg p{font-size:13.5px;color:var(--mid);line-height:1.9;max-width:380px}
}

/* ---------- 全体 ---------- */
.app{display:flex;height:100%}
.mockTag{
  position:fixed;top:10px;right:14px;z-index:60;
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:4px 12px;font-size:10.5px;color:var(--weak);letter-spacing:.05em;
}

/* ---------- 左メニュー ---------- */
.rail{
  width:234px;background:var(--panel);border-right:1px solid var(--line2);
  display:flex;flex-direction:column;flex-shrink:0;padding-top:20px;
}
.brand{font-family:var(--min);font-size:16.5px;font-weight:600;letter-spacing:.05em;padding:0 19px 20px}
#rail-nav{flex:1;padding:0 11px}
.nv{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;
    font-size:13.5px;color:var(--mid);margin-bottom:3px;width:100%}
.nv:hover{background:var(--card2);color:var(--ink)}
.nv.on{background:var(--card);color:var(--key);font-weight:700}
.nvi{line-height:0}.nvi svg{width:18px;height:18px;display:block}
.nvl{flex:1}
.nvn{background:var(--key);color:var(--keyInk);font-size:10px;font-weight:700;border-radius:9px;
     min-width:18px;height:18px;line-height:18px;text-align:center;padding:0 5px}
.sep{height:1px;background:var(--line2);margin:12px}
#rail-me{display:flex;align-items:center;gap:10px;padding:14px 17px;border-top:1px solid var(--line2)}
.meT{display:flex;flex-direction:column;min-width:0}
.meN{font-size:12.5px;font-weight:700}
.meC{font-size:10.5px;color:var(--weak);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

#stage{flex:1;display:flex;min-width:0}

/* ---------- 中列 ---------- */
.mid{width:338px;border-right:1px solid var(--line2);display:flex;flex-direction:column;flex-shrink:0}
.mid.wide{width:412px}
.midHd{font-family:var(--min);font-size:17px;font-weight:700;padding:21px 19px 13px}
.srch{padding:0 17px 12px}
.srch input{width:100%;background:var(--card);border:0;border-radius:9px;
            padding:10px 15px;font-size:12.5px;outline:none}
.srch input::placeholder{color:var(--weak)}
.srch input:focus{box-shadow:0 0 0 1px var(--key) inset}
.srch.solo2{padding:0 0 14px;max-width:420px}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 17px;margin-bottom:12px}
.chip{border:1px solid var(--line);border-radius:14px;padding:4px 11px;font-size:11.5px;color:var(--mid)}
.chip:hover{border-color:var(--weak);color:var(--ink)}
.chip.on{background:var(--key);border-color:var(--key);color:var(--keyInk);font-weight:700}
.cnt{font-size:11.5px;color:var(--weak);padding:0 19px 9px}
.rows{flex:1;padding:0 11px 14px;overflow-y:auto}

.row,.cv{display:flex;gap:12px;align-items:center;padding:11px;border-radius:10px;
         margin-bottom:3px;width:100%}
.row:hover,.cv:hover{background:var(--card2)}
.row.on,.cv.on{background:var(--card)}
.rm{flex:1;min-width:0;display:flex;flex-direction:column}
.rn{font-family:var(--min);font-size:15px;font-weight:600}
.rc{font-size:11.5px;color:var(--mid);margin-top:2px}
.ra{font-size:11.5px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rb{font-size:10.5px;color:var(--weak);margin-top:5px}
.tagA{background:var(--key);color:var(--keyInk);font-size:8.5px;font-weight:700;
      border-radius:3px;padding:1px 5px;margin-left:6px;vertical-align:middle}
.tagA.big{font-size:10px;padding:2px 7px;margin-left:8px}

.cvT{display:flex;align-items:baseline;gap:7px}
.cvN{font-family:var(--min);font-size:14.5px;font-weight:600;white-space:nowrap;
     overflow:hidden;text-overflow:ellipsis}
.cvS{font-size:10.5px;color:var(--weak);white-space:nowrap;flex-shrink:0}
.cvW{font-size:10.5px;color:var(--weak);margin-left:auto;flex-shrink:0}
.cvC{font-size:10.5px;color:var(--weak);margin-top:1px}
.cvP{font-size:12px;color:var(--mid);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mk{width:46px;height:46px;border-radius:50%;background:var(--card);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-family:var(--min);
    font-size:17px;flex-shrink:0}
.mk.acc{background:var(--key);color:var(--keyInk);border-color:var(--key)}
.mk.sm{width:32px;height:32px;font-size:13px}
.bdg{background:var(--key);color:var(--keyInk);font-size:10.5px;font-weight:700;border-radius:10px;
     min-width:20px;height:20px;line-height:20px;text-align:center;padding:0 6px;flex-shrink:0}

/* ---------- 会話 ---------- */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.mainHd{display:flex;align-items:center;gap:13px;padding:15px 24px;border-bottom:1px solid var(--line2)}
.mhT{display:flex;flex-direction:column;min-width:0}
.mhN{font-family:var(--min);font-size:16px;font-weight:700}
.mhC{font-size:11.5px;color:var(--weak);margin-top:2px}
.mhA{margin-left:auto;font-size:12px;color:var(--key);border:1px solid var(--key);
     border-radius:8px;padding:6px 14px;font-weight:700;flex-shrink:0}
.mhA:hover{background:var(--key);color:var(--keyInk)}
.thread{flex:1;padding:20px 24px;overflow-y:auto}
.day{text-align:center;font-size:11px;color:var(--weak);margin:14px 0}
.mr{display:flex;gap:10px;align-items:flex-end;margin-bottom:12px}
.mr.cont{margin-bottom:5px}
.mr.me{flex-direction:row-reverse}
.sp32{width:32px;flex-shrink:0}
.mw{max-width:min(560px,70%);display:flex;flex-direction:column;gap:4px}
.mr.me .mw{align-items:flex-end}
.who{font-size:11px;color:var(--mid);padding:0 4px}
.bub{background:var(--card);border-radius:14px;padding:12px 16px;font-size:14px;
     line-height:1.75;white-space:pre-wrap;word-break:break-word}
.mr.me .bub{background:var(--key);color:var(--keyInk)}
.mtime{font-size:10.5px;color:var(--weak);padding:0 4px}
.cmp{display:flex;gap:12px;align-items:flex-end;padding:16px 24px;border-top:1px solid var(--line2)}
.cmp textarea{flex:1;background:var(--card);border:0;border-radius:9px;padding:12px 16px;
              font-size:13.5px;resize:none;outline:none;max-height:130px;line-height:1.7}
.cmp textarea::placeholder{color:var(--weak)}
.cmp textarea:focus{box-shadow:0 0 0 1px var(--key) inset}
.cbtn{background:var(--key);color:var(--keyInk);border-radius:9px;padding:12px 26px;
      font-size:13px;font-weight:700;flex-shrink:0}
.cbtn:disabled{background:var(--card);color:var(--weak);cursor:default}

/* ---------- 右：プロフィール ---------- */
.side{flex:1;padding:28px 32px;min-width:0;overflow-y:auto}
.sHero{text-align:center;padding-bottom:22px;border-bottom:1px solid var(--line2)}
.sHero .ph{margin:0 auto}
.sName{font-family:var(--min);font-size:25px;font-weight:600;margin-top:15px;letter-spacing:.03em}
.sName.sm{font-size:20px;margin-top:0}
.sCo{font-size:14px;color:var(--mid);margin-top:5px}
.tags{display:flex;gap:6px;justify-content:center;margin-top:11px}
.tg{border:1px solid var(--line);border-radius:11px;padding:3px 11px;font-size:11.5px;color:var(--mid)}
.sBy{font-size:12px;color:var(--weak);margin-top:14px}
.sBy.left{text-align:left;margin-top:8px}
.artBig{background:var(--card);border-left:3px solid var(--accent);border-radius:10px;
        padding:22px 24px;margin:22px 0 20px}
.aK{font-size:10.5px;color:var(--accent);letter-spacing:.12em;font-weight:700;margin-bottom:9px}
.aT{font-family:var(--min);font-size:20px;line-height:1.65;font-weight:600}
.aL{font-size:13px;color:var(--mid);line-height:1.95;margin-top:13px}
.aG{font-size:12.5px;color:var(--key);font-weight:700;margin-top:16px}
.aG:hover{text-decoration:underline}
.sBtn{display:block;width:100%;background:var(--key);color:var(--keyInk);border-radius:10px;
      padding:14px;text-align:center;font-size:14.5px;font-weight:700}
.sBtn:hover{filter:brightness(1.12)}
.sBtn.ghost{background:none;border:1px solid var(--key);color:var(--key)}
.sBtn.quiet{background:none;border:1px solid var(--line);color:var(--mid)}
.sBtn.danger{background:none;border:1px solid var(--key);color:var(--key)}
.sBtn:disabled{opacity:.5;cursor:default}
.sBtn.inline{display:inline-block;width:auto;padding:11px 22px}
.sLink{display:block;width:100%;text-align:center;font-size:12px;color:var(--weak);
       margin-top:10px;text-decoration:underline}
.two{display:flex;gap:10px}
.two>*{flex:1}
.two.wide2{max-width:520px;margin-top:8px}
.sNote{font-size:11.5px;color:var(--weak);text-align:center;margin-top:14px;line-height:1.8}

/* ---------- 1列の画面 ---------- */
.solo{flex:1;padding:26px 34px;overflow-y:auto;min-width:0}
.soloHd{font-family:var(--min);font-size:21px;font-weight:700;margin-bottom:16px}
.soloSub{font-size:11.5px;color:var(--weak);letter-spacing:.09em;font-weight:700;
         margin:26px 0 10px}
.panel{background:var(--card);border-radius:11px;padding:22px 24px;max-width:720px}
.panel.narrow{max-width:620px}
.panel.tight{padding:6px 10px}
.panel.row2{display:flex;align-items:center;gap:22px}
.note{background:var(--card2);border-left:3px solid var(--accent);border-radius:8px;
      padding:15px 18px;font-size:12.5px;line-height:1.95;color:var(--mid);max-width:720px}
.note b{color:var(--ink)}
.note.mt,.hint.mt,.tbl.mt,.pcard.mt{margin-top:16px}
.fl{display:block;font-size:12px;font-weight:700;color:var(--mid);margin:14px 0 6px}
.fl:first-child{margin-top:0}
.fx{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:8px;
    padding:11px 14px;font-size:13.5px;outline:none;line-height:1.7}
.fx:focus{border-color:var(--key)}
.fx:disabled{color:var(--weak)}
textarea.fx{resize:vertical}
.hint{font-size:11.5px;color:var(--weak);margin-top:6px;line-height:1.75}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
.ok{background:#20331F;border:1px solid #38562F;border-radius:8px;padding:12px 15px;
    font-size:12.5px;color:#9FCB8E;margin-bottom:14px}
.codeBox{background:var(--card2);border:1px dashed var(--line);border-radius:9px;
         padding:14px;text-align:center;font-family:ui-monospace,Menlo,monospace;
         font-size:18px;letter-spacing:.14em;font-weight:600}
.muted{font-size:12.5px;color:var(--mid);line-height:1.95}
.ivRow{display:flex;align-items:center;gap:16px;padding:13px 14px;border-bottom:1px solid var(--line2)}
.ivRow:last-child{border-bottom:0}
.ivC{font-family:ui-monospace,Menlo,monospace;font-size:13px;letter-spacing:.07em;flex-shrink:0}
.ivD{font-size:11.5px;color:var(--weak);flex:1;min-width:0;overflow:hidden;
     text-overflow:ellipsis;white-space:nowrap}

/* ---------- 運営 ---------- */
.adm{padding-top:21px}
.admHd{display:flex;align-items:center;gap:24px;margin-bottom:18px;flex-wrap:wrap}
.admHd .soloHd{margin-bottom:0}
.atabs{display:flex;gap:7px;flex-wrap:wrap}
.at{border:1px solid var(--line);border-radius:15px;padding:6px 15px;font-size:12px;
    color:var(--mid);display:flex;align-items:center;gap:7px}
.at:hover{border-color:var(--weak);color:var(--ink)}
.at.on{background:var(--key);border-color:var(--key);color:var(--keyInk);font-weight:700}
.atn{background:rgba(0,0,0,.28);border-radius:8px;padding:0 6px;font-size:9.5px}
.stat{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;max-width:760px;margin-bottom:18px}
.st1{background:var(--card);border-radius:10px;padding:15px 17px}
.stn{font-size:24px;font-weight:700;font-family:var(--min)}
.stn.acc{color:var(--key)}
.stl{font-size:11px;color:var(--weak);margin-top:3px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:15px;max-width:1000px}
.pcard{background:var(--card);border-radius:11px;padding:18px 20px}
.pcard.wide3{max-width:860px}
.pHd{display:flex;align-items:center;gap:13px;margin-bottom:14px}
.pN{font-size:15.5px;font-weight:700}
.pC{font-size:11.5px;color:var(--mid);margin-top:2px}
.ptbl{display:grid;grid-template-columns:92px 1fr;row-gap:6px;font-size:12px;margin-bottom:16px}
.pk{color:var(--weak)}
.spread{display:flex;align-items:center;justify-content:space-between}
.dim{color:var(--weak);font-size:11.5px}
.snapT{font-size:11px;color:var(--weak);letter-spacing:.08em;font-weight:700;margin:4px 0 8px}
.snap{background:var(--card2);border-radius:9px;padding:14px 16px;font-size:12.5px;line-height:1.8}
.snr{padding:7px 0;border-bottom:1px dashed var(--line)}
.snr:last-child{border-bottom:0}
.snr.tgt{background:rgba(176,54,51,.14);margin:0 -16px;padding:7px 16px}
.snw{font-weight:700;color:var(--key);font-size:11.5px}
.snt{color:var(--weak);font-size:10.5px;margin-left:7px}
.mark{color:var(--key);font-weight:700;font-size:10.5px;margin-left:7px}

/* 表 */
.tbl{max-width:1000px;border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.thr,.tr{display:grid;grid-template-columns:1.3fr 1.3fr 1.2fr .7fr .7fr;align-items:center;
         gap:14px;padding:11px 16px}
.thr.g3,.tr.g3{grid-template-columns:2fr .6fr 1.4fr}
.thr{background:var(--card2);font-size:11px;color:var(--weak);font-weight:700;letter-spacing:.06em}
.tr{border-top:1px solid var(--line2);font-size:12.5px}
.tr:hover{background:var(--card2)}
.tdN{display:flex;align-items:center;gap:10px;font-weight:700;min-width:0}
.right{text-align:right}
.mini{border:1px solid var(--line);border-radius:7px;padding:4px 11px;font-size:11px;color:var(--mid)}
.mini:hover{border-color:var(--weak);color:var(--ink)}
.st{display:inline-block;border:1px solid var(--line);border-radius:9px;padding:2px 9px;
    font-size:10.5px;color:var(--weak)}
.st.ok2{color:#9FCB8E;border-color:#38562F}
.st.wait{color:#D9A84E;border-color:#5A4722}

/* 空 */
.empty{text-align:center;padding:52px 24px;color:var(--weak)}
.emIc{opacity:.5;margin-bottom:10px}
.emIc svg{width:28px;height:28px;display:inline-block}
.emT{font-size:14px;color:var(--mid);font-weight:700;margin-bottom:6px}
.emS{font-size:12.5px;line-height:1.8}

/* お知らせ */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:28px;z-index:80;
       background:#0D0D0D;border:1px solid var(--line);color:var(--ink);
       border-radius:9px;padding:12px 20px;font-size:12.5px;
       opacity:0;pointer-events:none;transition:opacity .18s;max-width:78vw;text-align:center}
.toast.on{opacity:1}

/* 画面の読みやすさ */
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#3A3A3A;border-radius:5px}
::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid var(--key);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

</style>
</head>
<body>

<div class="narrowMsg">
  <h1>パソコン用の見本です</h1>
  <p>この画面はパソコン版のモックです。<br>
     横幅1000ピクセル以上の画面でご覧ください。<br><br>
     スマートフォン版のモックは別にご用意しています。</p>
</div>

<div class="app">
  <aside class="rail">
    <div class="brand">社長の背中SNS</div>
    <nav id="rail-nav"></nav>
    <div id="rail-me"></div>
  </aside>
  <div id="stage"></div>
</div>

<div class="mockTag">モック　架空のデータです</div>
<div class="toast" id="toast"></div>

  return [p.name, p.co, p.ind, p.area].join(' ').toLowerCase().includes(q);

    body = `<button class="sBtn inline" data-noop="1">新しいグループをつくる</button>
      <div class="note mt">グループは事務局がつくり、お招きした方だけが参加できます。会員がご自身でつくることはできません。</div>
      <div class="tbl mt">
        <div class="thr g3"><div>グループ名</div><div>人数</div><div></div></div>
        ${gs.map(([n, c, all]) => `
        <div class="tr g3">
          <div class="tdN"><span class="mk sm ${all ? 'acc' : ''}">${all ? '全' : '組'}</span><span>${n}</span></div>
          <div>${c}名</div>
          <div class="right">${all ? '<span class="st">自動で全員が参加</span>' : '<button class="mini" data-noop="1">参加者を変える</button>'}</div>
        </div>`).join('')}
      </div>`;
  }

  if (admTab === 'announce') {
    body = `<div class="panel narrow">
      <div class="note">ご利用中の会員 <b>8名</b> のメールアドレスへ、一斉にお送りします。送信したあとの取り消しはできません。</div>
      <label class="fl">件名</label><input class="fx" id="anS" placeholder="例）新しい会員の方のご紹介">
      <label class="fl">本文</label><textarea class="fx" id="anB" rows="7" placeholder="いつもありがとうございます。&#10;事務局よりご連絡いたします。"></textarea>
      <div class="hint">冒頭に「○○ 様」、末尾に「社長の背中SNS 事務局」が自動で入ります。</div>
      <label class="fl">確認のため「送信」とご入力ください</label><input class="fx" id="anC" placeholder="送信">
      <button class="sBtn" id="anGo" disabled>会員全員へお送りする</button>
    </div>`;
  }

  if (admTab === 'reports') {
    body = `<div class="note">
        会員から「事務局に知らせる」が押されたときに、そのメッセージと前後のやりとりの<b>写し</b>がここに届きます。<br><br>
        事務局は、会員同士の1対1のやりとりそのものを読むことはできません。通報があった分の写しだけを確認する仕組みです。
      </div>
      <div class="pcard wide3 mt">
        <div class="spread">
          <span class="st ${repOpen ? 'wait' : 'ok2'}" id="repTag">${repOpen ? '未対応' : '対応済み'}</span>
          <span class="dim">2026/10/21 19:42</span>
        </div>
        <div class="ptbl mt">
          <div class="pk">知らせた方</div><div class="pv">大西 由美（大西運輸株式会社）</div>
          <div class="pk">対象の方</div><div class="pv">藤本 剛（フジモトITソリューションズ）</div>
          <div class="pk">気になった点</div><div class="pv">断ったあとも投資のお誘いが続いています。</div>
        </div>
        <div class="snapT">やりとりの写し（通報された時点のもの）</div>
        <div class="snap">
          <div class="snr"><span class="snw">藤本 剛</span><span class="snt">19:21</span>
            <div>先日のお話、ご検討いただけましたでしょうか。</div></div>
          <div class="snr"><span class="snw">大西 由美</span><span class="snt">19:33</span>
            <div>申し訳ありませんが、今回は見送らせていただきます。</div></div>
          <div class="snr tgt"><span class="snw">藤本 剛</span><span class="snt">19:40</span>
            <span class="mark">← 通報されたメッセージ</span>
            <div>そうおっしゃらずに。今月中なら特別な条件をご用意できます。他の社長さんも皆さん入られていますよ。</div></div>
        </div>
        ${repOpen ? `<div class="two mt">
          <button class="sBtn ghost" data-noop="1">メッセージを非表示にする</button>
          <button class="sBtn danger" data-noop="1">対象の方を退会させる</button>
          <button class="sBtn quiet" id="closeRep">対応済みにする</button>
        </div>` : `<div class="hint mt">対応：いま ／ 事務局</div>`}
      </div>`;
  }

  return `
  <section class="solo adm">
    <div class="admHd">
      <div class="soloHd">運営</div>
      <div class="atabs">${tabs.map(([t, l, n]) => `
        <button class="at${admTab === t ? ' on' : ''}" data-atab="${t}">${l}${n ? `<span class="atn">${n}</span>` : ''}</button>`).join('')}</div>
    </div>
    ${body}
  </section>`;
}

/* ---------------- 描画 ---------------- */
function render() {
  renderRail();
  const host = $('#stage');
  if (view === 'talk') host.innerHTML = renderTalk();
  else if (view === 'members') host.innerHTML = renderMembers();
  else if (view === 'invite') host.innerHTML = renderInvite();
  else if (view === 'me') host.innerHTML = renderMe();
  else host.innerHTML = renderAdmin();

  if (view === 'talk') {
    const th = $('#thread');
    if (th) th.scrollTop = th.scrollHeight;
    const inp = $('#msgIn');
    if (inp) inp.focus();
  }
}

/* ---------------- 操作 ---------------- */
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-view],[data-conv],[data-member],[data-ind],[data-atab],[data-ap],[data-rj],[data-friend],[data-accept],[data-cancel],[data-open],[data-art],[data-noop],#sendBtn,#issueInv,#againInv,#copyInv,#saveMe,#logout,#withdraw,#anGo,#closeRep');
  if (!t) return;

  if (t.dataset.view) { view = t.dataset.view; render(); return; }
  if (t.dataset.conv) { curConv = t.dataset.conv; CONV[curConv].unread = 0; render(); return; }
  if (t.dataset.member) { curMember = t.dataset.member; view = 'members'; render(); return; }
  if (t.dataset.ind) { memInd = t.dataset.ind; render(); return; }
  if (t.dataset.atab) { admTab = t.dataset.atab; render(); return; }

  if (t.dataset.friend) { PEOPLE[t.dataset.friend].rel = 'sent'; render(); toast('お申し込みをお送りしました。'); return; }
  if (t.dataset.accept) { PEOPLE[t.dataset.accept].rel = 'friend'; render(); toast('友達になりました。'); return; }
  if (t.dataset.cancel) { PEOPLE[t.dataset.cancel].rel = 'none'; render(); return; }
  if (t.dataset.open) {
    const id = t.dataset.open;
    if (!CONV[id]) { CONV[id] = { id, kind: 'dm', other: id, unread: 0, msgs: [] }; CONV_ORDER.unshift(id); }
    curConv = id; view = 'talk'; render(); return;
  }
  if (t.dataset.art) { toast('本番では、社長の背中の記事ページが開きます。'); return; }
  if (t.dataset.noop) { toast('モックのため、この操作は動きません。'); return; }

  if (t.id === 'sendBtn') { send(); return; }
  if (t.id === 'issueInv') { inviteCode = makeCode(); render(); return; }
  if (t.id === 'againInv') { inviteCode = null; render(); return; }
  if (t.id === 'copyInv') { toast('文面をコピーしました。'); return; }
  if (t.id === 'saveMe') { toast('保存しました。'); return; }
  if (t.id === 'logout') { toast('本番ではログイン画面に戻ります。'); return; }
  if (t.id === 'withdraw') { toast('本番では確認の入力を求めます。'); return; }
  if (t.id === 'anGo') { toast('8名へお送りしました。'); return; }
  if (t.id === 'closeRep') { repOpen = false; render(); toast('対応済みにしました。'); return; }

  if (t.dataset.ap) {
    const id = +t.dataset.ap;
    const p = pend.find((x) => x.id === id);
    pend = pend.filter((x) => x.id !== id);
    render(); toast(`${p.name} さんを承認しました。`); return;
  }
  if (t.dataset.rj) {
    pend = pend.filter((x) => x.id !== +t.dataset.rj);
    render(); toast('お断りの処理をしました。'); return;
  }
});

document.addEventListener('input', (e) => {
  if (e.target.id === 'memQ') { memQ = e.target.value; const s = e.target.selectionStart; render(); const n = $('#memQ'); if (n) { n.focus(); n.setSelectionRange(s, s); } }
  if (e.target.id === 'msgIn') {
    e.target.style.height = 'auto';
    e.target.style.height = Math.min(e.target.scrollHeight, 130) + 'px';
    $('#sendBtn').disabled = !e.target.value.trim();
  }
  if (['anS', 'anB', 'anC'].includes(e.target.id)) {
    const ok = $('#anS').value.trim() && $('#anB').value.trim() && $('#anC').value === '送信';
    $('#anGo').disabled = !ok;
  }
});

document.addEventListener('keydown', (e) => {
  if (e.target.id === 'msgIn' && e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); send(); }
});

function send() {
  const i = $('#msgIn');
  const v = i.value.trim();
  if (!v) return;
  const d = new Date();
  const t = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  CONV[curConv].msgs.push({ who: 'me', t, b: v });
  render();
}

function makeCode() {
  const ch = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = '';
  for (let i = 0; i < 12; i++) s += ch[Math.floor(Math.random() * ch.length)];
  return `${s.slice(0, 4)}-${s.slice(4, 8)}-${s.slice(8, 12)}`;
}

render();

</script>
</body>
</html>
